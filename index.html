<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>michaelpopovic.se // Omdirigerar...</title>
    <style>
        body {
            background-color: #000000;
            color: #00ffcc;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid rgba(0, 255, 236, 0.1);
            width: 60px;
            height: 60px;
            border-radius: 50%;
            border-left-color: #00ffcc;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px rgba(0, 255, 236, 0.4);
        }
        h1 {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
    
    <!-- Den här raden tvingar webbläsaren att hoppa direkt till simulatorn efter 1 sekund -->
    <meta http-equiv="refresh" content="1;url=https://www.falstad.com/circuit/circuitjs.html">
</head>
<body>

    <div class="loader"></div>
    <h1>Ansluter till Falstad Circuit Simulator...</h1>

    <script>
        // En extra säkerhetsåtgärd i JavaScript som skickar vidare direkt om meta-taggen skulle missa
        setTimeout(function() {
            window.location.href = "https://www.falstad.com/circuit/circuitjs.html";
        }, 1000);
    </script>
</body>
</html>
