<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>michaelpopovic.se // PLASMA CORE</title>
    <style>
        :root {
            --theme-color: #00f0ff;
            --theme-glow: rgba(0, 240, 255, 0.4);
            --bg-color: #060814;
        }
        body {
            background-color: var(--bg-color);
            margin: 0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            user-select: none;
            transition: background-color 0.5s;
        }
        canvas {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }
        .control-section {
            position: relative;
            z-index: 2;
            width: 90%;
            max-width: 400px;
            margin-bottom: 40px;
            text-align: center;
        }
        input[type=range] {
            width: 100%;
            height: 10px;
            background: #1e293b;
            border-radius: 99px;
            outline: none;
            accent-color: var(--theme-color);
            cursor: pointer;
            box-shadow: 0 0 10px var(--theme-glow);
        }
    </style>
</head>
<body>

<canvas id="lightningCanvas"></canvas>

<div class="control-section">
    <input type="range" id="powerSlider" min="1" max="100" value="25">
</div>

<script>
    const canvas = document.getElementById('lightningCanvas');
    const ctx = canvas.getContext('2d');
    const slider = document.getElementById('powerSlider');

    let mouseX = null;
    let mouseY = null;
    let isOverload = false;

    function resizeCanvas() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    window.addEventListener('mousemove', (e) => { mouseX = e.clientX; mouseY = e.clientY; });
    window.addEventListener('mouseout', () => { mouseX = null; mouseY = null; });
    
    window.addEventListener('touchmove', (e) => { 
        if(e.touches.length > 0) {
            mouseX = e.touches[0].clientX; 
            mouseY = e.touches[0].clientY; 
        }
    });
    window.addEventListener('touchend', () => { mouseX = null; mouseY = null; });

    function drawLightning(startX, startY, endX, endY, segments, displace) {
        ctx.beginPath();
        ctx.moveTo(startX, startY);
        
        let currX = startX;
        let currY = startY;
        
        for (let i = 1; i <= segments; i++) {
            let t = i / segments;
            let targetX = startX + (endX - startX) * t;
            let targetY = startY + (endY - startY) * t;
            
            if (i < segments) {
                targetX += (Math.random() - 0.5) * displace;
                targetY += (Math.random() - 0.5) * displace;
            }
            
            ctx.lineTo(targetX, targetY);
            currX = targetX;
            currY = targetY;
        }
        ctx.stroke();
    }

    function loop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const coreX = canvas.width / 2;
        const coreY = canvas.height / 2;
        const power = parseInt(slider.value);

        if (power > 80) {
            if (!isOverload) {
                isOverload = true;
                document.documentElement.style.setProperty('--theme-color', '#ff0055');
                document.documentElement.style.setProperty('--theme-glow', 'rgba(255, 0, 85, 0.5)');
                document.documentElement.style.setProperty('--bg-color', '#1c0309');
            }
        } else {
            if (isOverload) {
                isOverload = false;
                document.documentElement.style.setProperty('--theme-color', '#00f0ff');
                document.documentElement.style.setProperty('--theme-glow', 'rgba(0, 240, 255, 0.4)');
                document.documentElement.style.setProperty('--bg-color', '#060814');
            }
        }

        ctx.shadowBlur = isOverload ? 20 : 10;
        ctx.shadowColor = isOverload ? '#ff0055' : '#00f0ff';

        if (mouseX !== null && mouseY !== null) {
            ctx.strokeStyle = isOverload ? '#ff88aa' : '#94f3ff';
            ctx.lineWidth = Math.random() * 3 + 1;
            drawLightning(coreX, coreY, mouseX, mouseY, 12, 35);
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 1;
            drawLightning(coreX, coreY, mouseX, mouseY, 12, 35);
        }

        let extraBlixtar = Math.floor(power / 15);
        if (isOverload) extraBlixtar += 4;

        for (let i = 0; i < extraBlixtar; i++) {
            if (Math.random() > 0.6) {
                let angle = Math.random() * Math.PI * 2;
                let distance = 100 + Math.random() * (canvas.width / 2);
                let targetX = coreX + Math.cos(angle) * distance;
                let targetY = coreY + Math.sin(angle) * distance;
                
                ctx.lineWidth = Math.random() * 2;
                ctx.strokeStyle = isOverload ? '#ff0055' : 'rgba(0, 240, 255, 0.7)';
                drawLightning(coreX, coreY, targetX, targetY, 10, 40);
            }
        }

        requestAnimationFrame(loop);
    }

    loop();
</script>
</body>
</html>
